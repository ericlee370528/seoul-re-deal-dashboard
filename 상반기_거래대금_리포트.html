<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 상반기 지점별 거래대금 리포트</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --good:           #006300;
    --border:         rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* 강남지점 */
    --series-2: #eb6834; /* 여의도지점 */
    --series-3: #1baf7a; /* 판교지점 */
    --series-4: #eda100; /* 천안지점 */
    --series-5: #e87ba4; /* 수원지점 */
  }
  @media (prefers-color-scheme: dark) {
    .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --good:           #0ca30c;
      --border:         rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 24px 64px; }
  header h1 { font-size: 22px; margin: 0 0 6px; }
  header p { font-size: 14px; color: var(--text-secondary); margin: 0 0 28px; line-height: 1.6; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .card h2 { font-size: 15px; margin: 0 0 16px; color: var(--text-primary); }
  .card .note { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; line-height: 1.6; }

  /* KPI stat tiles */
  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .rank { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: .02em; }
  .tile .label { font-size: 13.5px; color: var(--text-primary); margin: 4px 0 8px; font-weight: 600; }
  .tile .value { font-size: 22px; font-weight: 600; }
  .tile .delta { font-size: 12px; margin-top: 4px; }
  .tile .delta.up { color: var(--good); }
  .tile svg.spark { display: block; margin-top: 10px; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .legend-item .key { width: 14px; height: 2px; border-radius: 1px; }

  /* Chart */
  .chart-container { position: relative; }
  svg#linechart { width: 100%; height: auto; overflow: visible; }
  .axis-label { font-size: 11px; fill: var(--text-muted); }
  .end-label { font-size: 12px; font-weight: 600; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .hover-col { fill: transparent; }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    opacity: 0;
    transition: opacity .1s ease;
    min-width: 150px;
    z-index: 5;
  }
  #tooltip .t-month { font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
  #tooltip .t-row { display: flex; align-items: center; gap: 6px; justify-content: space-between; padding: 2px 0; }
  #tooltip .t-key { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  #tooltip .t-key .swatch { width: 10px; height: 2px; border-radius: 1px; }
  #tooltip .t-val { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  #tooltip .t-val.missing { color: var(--text-muted); font-weight: 400; font-style: italic; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  td.missing { color: var(--text-muted); font-style: italic; font-variant-numeric: normal; }
  tfoot td { font-weight: 700; border-bottom: none; border-top: 2px solid var(--baseline); }

  @media (max-width: 720px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <header>
      <h1>2026년 상반기(1~6월) 지점별 거래대금 리포트</h1>
      <p>
        전체 20개 지점 중 상반기 누적 거래대금 상위 5개 지점을 선정했습니다.
        데이터 출처: 지점별_실적_더미데이터_정리본.xlsx · 결측/중복 정리 완료본 기준.
      </p>
    </header>

    <section class="card">
      <h2>상위 5개 지점 · 상반기 누적 거래대금</h2>
      <div class="kpi-row" id="kpiRow"></div>
    </section>

    <section class="card">
      <h2>월별 거래대금 추이 (억원)</h2>
      <div class="legend" id="legend"></div>
      <div class="chart-container">
        <svg id="linechart" viewBox="0 0 860 420" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="tooltip"></div>
      </div>
      <p class="note">
        ※ 여의도지점 2026-02는 원본 데이터의 수수료수익 결측으로 정리 과정에서 해당 행이 삭제되어 이 구간은 점선으로 표시했습니다.
      </p>
    </section>

    <section class="card">
      <h2>월별 상세 데이터</h2>
      <table id="dataTable"></table>
    </section>
  </div>
</div>

<script>
(function () {
  var months = ["1월", "2월", "3월", "4월", "5월", "6월"];

  // rank order = fixed categorical slot order (series-1 .. series-5)
  var branches = [
    { name: "강남지점",   slot: 1, values: [1256.1, 1367.3, 1443.4, 1458.7, 1574.7, 1540.1] },
    { name: "여의도지점", slot: 2, values: [1170.3, null,   1298.1, 1333.7, 1495.8, 1479.8] },
    { name: "판교지점",   slot: 3, values: [812.8,  856.7,  1107.2, 1199.7, 1250.9, 1245.7] },
    { name: "천안지점",   slot: 4, values: [812.2,  933.0,  892.9,  907.2,  999.7,  1053.9] },
    { name: "수원지점",   slot: 5, values: [714.9,  778.9,  860.1,  882.6,  1074.2, 1107.4] }
  ];

  branches.forEach(function (b) {
    var vals = b.values.filter(function (v) { return v !== null; });
    b.total = vals.reduce(function (a, v) { return a + v; }, 0);
    var firstVal = b.values.find(function (v) { return v !== null; });
    var lastVal = b.values[b.values.length - 1];
    b.deltaPct = ((lastVal - firstVal) / firstVal) * 100;
  });

  var vizRoot = document.querySelector(".viz-root");
  function seriesColor(slot) {
    return getComputedStyle(vizRoot).getPropertyValue("--series-" + slot).trim();
  }
  function fmt1(n) { return n.toLocaleString("ko-KR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }

  // ---------- KPI tiles ----------
  var kpiRow = document.getElementById("kpiRow");
  branches.forEach(function (b, i) {
    var color = seriesColor(b.slot);
    var tile = document.createElement("div");
    tile.className = "tile";

    var rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = (i + 1) + "위";
    tile.appendChild(rank);

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = b.name;
    tile.appendChild(label);

    var value = document.createElement("div");
    value.className = "value";
    value.textContent = fmt1(b.total) + "억원";
    tile.appendChild(value);

    var delta = document.createElement("div");
    delta.className = "delta" + (b.deltaPct >= 0 ? " up" : "");
    delta.textContent = (b.deltaPct >= 0 ? "▲ " : "▼ ") + Math.abs(b.deltaPct).toFixed(1) + "% (1월 대비 6월)";
    tile.appendChild(delta);

    // sparkline
    var w = 140, h = 32, pad = 3;
    var vals = b.values.filter(function (v) { return v !== null; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var svgNS = "http://www.w3.org/2000/svg";
    var spark = document.createElementNS(svgNS, "svg");
    spark.setAttribute("class", "spark");
    spark.setAttribute("width", w);
    spark.setAttribute("height", h);
    spark.setAttribute("viewBox", "0 0 " + w + " " + h);
    var n = b.values.length;
    var pts = [];
    b.values.forEach(function (v, idx) {
      var x = pad + (idx / (n - 1)) * (w - pad * 2);
      if (v === null) { pts.push(null); return; }
      var y = h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
      pts.push([x, y]);
    });
    var segs = [];
    var cur = [];
    pts.forEach(function (p) {
      if (p === null) { if (cur.length) segs.push(cur); cur = []; }
      else cur.push(p);
    });
    if (cur.length) segs.push(cur);
    segs.forEach(function (seg) {
      var d = seg.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
      var path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      spark.appendChild(path);
    });
    var lastPt = pts[pts.length - 1];
    if (lastPt) {
      var dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("cx", lastPt[0]);
      dot.setAttribute("cy", lastPt[1]);
      dot.setAttribute("r", 3);
      dot.setAttribute("fill", color);
      spark.appendChild(dot);
    }
    tile.appendChild(spark);
    kpiRow.appendChild(tile);
  });

  // ---------- Legend ----------
  var legend = document.getElementById("legend");
  branches.forEach(function (b) {
    var item = document.createElement("div");
    item.className = "legend-item";
    var key = document.createElement("span");
    key.className = "key";
    key.style.background = seriesColor(b.slot);
    item.appendChild(key);
    var txt = document.createElement("span");
    txt.textContent = b.name;
    item.appendChild(txt);
    legend.appendChild(item);
  });

  // ---------- Line chart ----------
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("linechart");
  var W = 860, H = 420;
  var M = { top: 20, right: 90, bottom: 36, left: 56 };
  var plotW = W - M.left - M.right;
  var plotH = H - M.top - M.bottom;

  var allVals = branches.reduce(function (acc, b) { return acc.concat(b.values.filter(function (v) { return v !== null; })); }, []);
  var yMax = 1600; // rounded clean tick above max (~1574.7)
  var yMin = 0;
  var yTicks = [0, 400, 800, 1200, 1600];

  function xPos(i) { return M.left + (i / (months.length - 1)) * plotW; }
  function yPos(v) { return M.top + plotH - ((v - yMin) / (yMax - yMin)) * plotH; }

  // gridlines + y-axis labels
  yTicks.forEach(function (t) {
    var y = yPos(t);
    var line = document.createElementNS(svgNS, "line");
    line.setAttribute("class", "gridline");
    line.setAttribute("x1", M.left); line.setAttribute("x2", M.left + plotW);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    svg.appendChild(line);

    var label = document.createElementNS(svgNS, "text");
    label.setAttribute("class", "axis-label");
    label.setAttribute("x", M.left - 10);
    label.setAttribute("y", y + 4);
    label.setAttribute("text-anchor", "end");
    label.textContent = t.toLocaleString("ko-KR");
    svg.appendChild(label);
  });

  // baseline (x-axis)
  var base = document.createElementNS(svgNS, "line");
  base.setAttribute("class", "baseline");
  base.setAttribute("x1", M.left); base.setAttribute("x2", M.left + plotW);
  base.setAttribute("y1", M.top + plotH); base.setAttribute("y2", M.top + plotH);
  svg.appendChild(base);

  // x-axis labels
  months.forEach(function (m, i) {
    var label = document.createElementNS(svgNS, "text");
    label.setAttribute("class", "axis-label");
    label.setAttribute("x", xPos(i));
    label.setAttribute("y", M.top + plotH + 22);
    label.setAttribute("text-anchor", "middle");
    label.textContent = "2026-" + String(i + 1).padStart(2, "0");
    svg.appendChild(label);
  });

  // series lines + markers + end labels
  var endLabels = [];
  branches.forEach(function (b) {
    var color = seriesColor(b.slot);
    var segs = [];
    var cur = [];
    b.values.forEach(function (v, i) {
      if (v === null) { if (cur.length) segs.push(cur); cur = []; return; }
      cur.push([xPos(i), yPos(v)]);
    });
    if (cur.length) segs.push(cur);

    segs.forEach(function (seg, segIdx) {
      var d = seg.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
      var path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      svg.appendChild(path);
    });

    // dashed connector across the gap (missing month), if any
    b.values.forEach(function (v, i) {
      if (v === null && i > 0 && i < b.values.length - 1) {
        var prevIdx = i - 1, nextIdx = i + 1;
        while (b.values[prevIdx] === null && prevIdx > 0) prevIdx--;
        while (b.values[nextIdx] === null && nextIdx < b.values.length - 1) nextIdx++;
        if (b.values[prevIdx] !== null && b.values[nextIdx] !== null) {
          var dash = document.createElementNS(svgNS, "line");
          dash.setAttribute("x1", xPos(prevIdx)); dash.setAttribute("y1", yPos(b.values[prevIdx]));
          dash.setAttribute("x2", xPos(nextIdx)); dash.setAttribute("y2", yPos(b.values[nextIdx]));
          dash.setAttribute("stroke", color);
          dash.setAttribute("stroke-width", "2");
          dash.setAttribute("stroke-dasharray", "4 4");
          dash.setAttribute("opacity", "0.55");
          svg.appendChild(dash);
        }
      }
    });

    // markers with surface ring
    b.values.forEach(function (v, i) {
      if (v === null) return;
      var ring = document.createElementNS(svgNS, "circle");
      ring.setAttribute("cx", xPos(i)); ring.setAttribute("cy", yPos(v));
      ring.setAttribute("r", 5);
      ring.setAttribute("fill", "var(--surface-1)");
      svg.appendChild(ring);
      var dot = document.createElementNS(svgNS, "circle");
      dot.setAttribute("cx", xPos(i)); dot.setAttribute("cy", yPos(v));
      dot.setAttribute("r", 4);
      dot.setAttribute("fill", color);
      svg.appendChild(dot);
    });

    // direct end label anchor (rendered after collision resolution below)
    var lastIdx = b.values.length - 1;
    while (b.values[lastIdx] === null) lastIdx--;
    var ey = yPos(b.values[lastIdx]);
    endLabels.push({ name: b.name, x: xPos(lastIdx), y: ey, origY: ey });
  });

  // resolve end-label collisions: sort by y, enforce a minimum gap,
  // and draw a thin leader line when a label is nudged away from its point
  var MIN_GAP = 14;
  endLabels.sort(function (a, b) { return a.y - b.y; });
  for (var li = 1; li < endLabels.length; li++) {
    if (endLabels[li].y - endLabels[li - 1].y < MIN_GAP) {
      endLabels[li].y = endLabels[li - 1].y + MIN_GAP;
    }
  }
  endLabels.forEach(function (el) {
    var labelX = el.x + 14;
    if (Math.abs(el.y - el.origY) > 1) {
      var leader = document.createElementNS(svgNS, "line");
      leader.setAttribute("x1", el.x + 2); leader.setAttribute("y1", el.origY);
      leader.setAttribute("x2", labelX - 4); leader.setAttribute("y2", el.y);
      leader.setAttribute("stroke", "var(--text-muted)");
      leader.setAttribute("stroke-width", "1");
      svg.appendChild(leader);
    }
    var endLabel = document.createElementNS(svgNS, "text");
    endLabel.setAttribute("class", "end-label");
    endLabel.setAttribute("x", labelX);
    endLabel.setAttribute("y", el.y + 4);
    endLabel.setAttribute("fill", "var(--text-primary)");
    endLabel.textContent = el.name;
    svg.appendChild(endLabel);
  });

  // crosshair
  var crosshair = document.createElementNS(svgNS, "line");
  crosshair.setAttribute("class", "crosshair");
  crosshair.setAttribute("y1", M.top);
  crosshair.setAttribute("y2", M.top + plotH);
  svg.appendChild(crosshair);

  // hover columns (hit targets)
  var tooltip = document.getElementById("tooltip");
  var chartContainer = document.querySelector(".chart-container");
  var colW = plotW / months.length;

  months.forEach(function (m, i) {
    var rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("class", "hover-col");
    rect.setAttribute("x", M.left + i * colW);
    rect.setAttribute("y", M.top);
    rect.setAttribute("width", colW);
    rect.setAttribute("height", plotH);
    rect.style.cursor = "crosshair";

    rect.addEventListener("pointermove", function (evt) {
      crosshair.setAttribute("x1", xPos(i));
      crosshair.setAttribute("x2", xPos(i));
      crosshair.style.opacity = "1";

      tooltip.innerHTML = "";
      var monthLine = document.createElement("div");
      monthLine.className = "t-month";
      monthLine.textContent = "2026년 " + m;
      tooltip.appendChild(monthLine);

      branches.forEach(function (b) {
        var row = document.createElement("div");
        row.className = "t-row";
        var keyWrap = document.createElement("div");
        keyWrap.className = "t-key";
        var sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = seriesColor(b.slot);
        keyWrap.appendChild(sw);
        var nameEl = document.createElement("span");
        nameEl.textContent = b.name;
        keyWrap.appendChild(nameEl);
        row.appendChild(keyWrap);

        var valEl = document.createElement("span");
        var v = b.values[i];
        if (v === null) {
          valEl.className = "t-val missing";
          valEl.textContent = "결측";
        } else {
          valEl.className = "t-val";
          valEl.textContent = fmt1(v) + "억";
        }
        row.appendChild(valEl);
        tooltip.appendChild(row);
      });

      var svgRect = svg.getBoundingClientRect();
      var containerRect = chartContainer.getBoundingClientRect();
      var scale = svgRect.width / W;
      var px = xPos(i) * scale;
      tooltip.style.opacity = "1";
      var left = px + 16;
      if (left + 170 > containerRect.width) left = px - 170;
      tooltip.style.left = left + "px";
      tooltip.style.top = "8px";
    });

    rect.addEventListener("pointerleave", function () {
      crosshair.style.opacity = "0";
      tooltip.style.opacity = "0";
    });

    svg.appendChild(rect);
  });

  // ---------- Table ----------
  var table = document.getElementById("dataTable");
  var thead = document.createElement("thead");
  var headRow = document.createElement("tr");
  var th0 = document.createElement("th");
  th0.textContent = "지점명";
  headRow.appendChild(th0);
  months.forEach(function (m) {
    var th = document.createElement("th");
    th.textContent = "2026-" + String(months.indexOf(m) + 1).padStart(2, "0");
    headRow.appendChild(th);
  });
  var thTotal = document.createElement("th");
  thTotal.textContent = "상반기 합계";
  headRow.appendChild(thTotal);
  thead.appendChild(headRow);
  table.appendChild(thead);

  var tbody = document.createElement("tbody");
  branches.forEach(function (b) {
    var tr = document.createElement("tr");
    var tdName = document.createElement("td");
    tdName.textContent = b.name;
    tr.appendChild(tdName);
    b.values.forEach(function (v) {
      var td = document.createElement("td");
      if (v === null) { td.className = "missing"; td.textContent = "결측(삭제됨)"; }
      else { td.textContent = fmt1(v); }
      tr.appendChild(td);
    });
    var tdTotal = document.createElement("td");
    tdTotal.textContent = fmt1(b.total) + "억원";
    tr.appendChild(tdTotal);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
})();
</script>
</body>
</html>
